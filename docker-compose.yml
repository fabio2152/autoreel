# Servicios para el desarrollo local. El backend y el frontend se ejecutan fuera de Docker (ver README).
# Las variables se leen del archivo .env de esta carpeta (copiar desde .env.example).
name: autoreel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoreel}
      POSTGRES_USER: ${POSTGRES_USER:-autoreel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
    ports:
      # Solo accesible desde esta máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento compatible con S3 para desarrollo (fotos, logos y, más adelante, videos).
  # En producción se usa Amazon S3 sin cambiar el código. Exige firma SigV4 con las credenciales del .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Define AWS_ACCESS_KEY_ID en .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Define AWS_SECRET_ACCESS_KEY en .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-datos:/data

volumes:
  postgres-datos:
  seaweedfs-datos:
