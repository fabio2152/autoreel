# Valores solo para las pruebas automatizadas. La base de datos la entrega Testcontainers (@ServiceConnection).
spring:
  datasource:
    url: jdbc:postgresql://testcontainers/no-usada
    username: testcontainers
    password: testcontainers

autoreel:
  url-aplicacion: http://localhost:5173
  seguridad:
    # 32 bytes en base64, exclusivos para pruebas.
    jwt-secreto: dGVzdC1zZWNyZXRvLXNvbG8tcGFyYS1wcnVlYmFzLTMyYg==
    sesion-horas: 8
    cookie-segura: false
  admin:
    correo: admin@autoreel.test
    contrasena: AdminPrueba123
  almacenamiento:
    # Las pruebas de integración usan AlmacenEnMemoria; S3Almacen se prueba aparte contra SeaweedFS.
    tipo: memoria
    bucket: pruebas
  # Sin clave por defecto: el guion usa el respaldo. Las pruebas que la necesitan la ponen con @DynamicPropertySource.
  secretos:
    "[autoreel/gemini]": ""
  ia:
    gemini:
      url: http://127.0.0.1:9
      tiempo-conexion: 500ms
      tiempo-lectura: 500ms
  # Las pruebas llaman a los procesadores directamente.
  tareas:
    activas: false
