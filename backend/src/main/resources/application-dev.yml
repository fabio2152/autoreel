# Perfil de desarrollo local: lee las variables del .env de la raíz del repositorio.
spring:
  config:
    import: optional:file:../.env[.properties]

autoreel:
  seguridad:
    cookie-segura: false
  almacenamiento:
    crear-bucket: true
  # Negocio de ejemplo de la sección 16 (solo dev).
  demo:
    correo: ${DEMO_NEGOCIO_EMAIL:}
    contrasena: ${DEMO_NEGOCIO_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true
