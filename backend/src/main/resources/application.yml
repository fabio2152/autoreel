spring:
  application:
    name: autoreel
  autoconfigure:
    # La autenticación es propia (FiltroJwtCookie); no se necesita el usuario en memoria de Spring Boot.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

autoreel:
  url-aplicacion: ${APP_URL}
  seguridad:
    jwt-secreto: ${JWT_SECRET}
    sesion-horas: ${SESION_HORAS:8}
    cookie-segura: true
  admin:
    correo: ${ADMIN_EMAIL:}
    contrasena: ${ADMIN_PASSWORD:}
  almacenamiento:
    tipo: s3
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:us-east-1}
    # Vacíos en AWS (se usa el rol de la instancia); con valor en desarrollo (SeaweedFS).
    endpoint: ${S3_ENDPOINT:}
    endpoint-publico: ${S3_ENDPOINT_PUBLICO:}
    clave-acceso: ${AWS_ACCESS_KEY_ID:}
    clave-secreta: ${AWS_SECRET_ACCESS_KEY:}
    crear-bucket: false
  # Credenciales de los proveedores de IA por nombre de secreto (RN-55). En producción, Secrets Manager (fase 8).
  # La clave va entre comillas y corchetes para conservar la "/".
  secretos:
    "[autoreel/gemini]": ${GEMINI_API_KEY:}
  ia:
    gemini:
      url: ${GEMINI_URL:https://generativelanguage.googleapis.com}
      tiempo-conexion: 5s
      tiempo-lectura: 30s
  tareas:
    activas: true
    guiones-cada: 3s
